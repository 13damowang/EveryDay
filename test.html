<script>
  let arr = [
    {"date":"2025/02/17","workType":"REST","workTime":5,"niuMaTime":2}
  ]
  let id = 6
  const itemStatusArr = document.getElementsByClassName('opt-type') //状态
  // 根据每个星期7天来循环
  for (let m = 0; m <= id; m++) {
    arr.forEach((item,index) => {
      console.log(document.getElementById)
      const itemTr = document.getElementById(`tr${m}`)  //填写日期
      const itemworkHours = document.getElementById(`workHours${m}`)
      const iremWorkContent = document.getElementById(`workContent${m}`)
      const addRow = document.getElementById(`addRow${m}`)
      tdDate = itemTr.querySelector('td').innerHTML
      if (tdDate === item.date) {
        iremWorkContent.value = '1'
        switch (item.workType) {
          case 'WORK':  //正常
          itemStatusArr[index].value = item.workType
          itemworkHours.value = item.workTime
          break

          case 'OVERTIME':  //加班
          itemStatusArr[index].value = 'WORK'
          itemworkHours.value = item.workTime
          setTimeout(() => {
            addRow.onclick(index)
          }, 3000)
            break
          
          case 'REST':  //调休
          if (8 - item.workTime === 0) {
            itemStatusArr[index].value = item.workType
            itemworkHours.value = 0
          } else {
            itemStatusArr[index].value = 'WORK'
            itemworkHours.value = item.workTime
            setTimeout(() => {
              addRow.onclick(index)
            }, 3000)
            if (item.niuMaTime) {
              setTimeout(() => {
                addRow.onclick(index) //log
              }, 3000)
            }
          }
          break
        }
      }
    })
  }
  // console.log(arr)
  post('api/postapi', {
    params: {}
  }).then(res => {
    console.log(res.data)
  })

</script>
